name: Project CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Cancel a run when the same branch is pushed again — a superseded run is one
# nobody will read. This matters most for the ios job: macOS runners bill at 10x
# the rate of ubuntu ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint and detekt
        run: ./gradlew staticAnalysis --continue

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  ios:
    name: iOS (simulator framework)
    # Gated on static-analysis purely for cost — macOS minutes are 10x ubuntu.
    needs: static-analysis
    # Kotlin/Native cannot build Apple targets on Linux. This job must run on macOS.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The Kotlin/Native toolchain and platform libraries land in ~/.konan, which
      # setup-gradle does not cache. Without this every run re-downloads ~1 GB.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Links the framework the Xcode project consumes. Simulator arm64 only: it
      # proves the shared code compiles and links for iOS without needing signing
      # certificates. Swap in linkDebugFrameworkIosArm64 to cover the device target.
      - name: Link iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
