#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Allow a single Kotlin Multiplatform module (composeApp) to also be the Android
# application. Since AGP 9.0, com.android.application is incompatible with the KMP
# plugin under the new DSL; these flags restore the pre-9.0 behavior that permits it.
android.newDsl=false
android.builtInKotlin=false